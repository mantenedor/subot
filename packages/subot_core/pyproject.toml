[project]
name = "subot-core"
version = "0.1.0"
description = "Núcleo de segurança do subot: inventário, política, confirmação, auditoria, gateway SSH e cliente Guacamole."
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.4",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subot_core"]
