[project]
name = "subot-orchestrator"
version = "0.1.0"
description = "Orquestrador multi-provider do subot: carrega agents/*.md e roda cada agente na IA (local ou remota) que ele declarar."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "mcp>=1.2",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.scripts]
subot = "subot_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["subot_orchestrator"]
