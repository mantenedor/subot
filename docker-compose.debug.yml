# Overlay de DIAGNÓSTICO — NÃO é carregado automaticamente pelo 'docker compose' (só o
# docker-compose.yml é). Publica o Guacamole direto na porta 8080, sem TLS, sem Caddy no meio —
# útil só pra isolar se um problema de conexão está no Caddy/TLS ou em outro lugar (rede,
# Docker, o próprio Guacamole). NÃO deixe isso ativo em produção: bypassa toda a camada de
# TLS/proxy único de entrada que o resto do projeto pressupõe.
#
# Ativar:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d guacamole
# Testar:
#   http://<IP-da-VM>:8080/guacamole/
# Desativar (volta ao normal, guacamole sem porta publicada):
#   docker compose up -d guacamole
services:
  guacamole:
    ports:
      - "8080:8080"
