name: subot

# Variáveis de ambiente do container 'agent' (Claude Code + subot_orchestrator + Ollama + API +
# MCP servers, tudo num container só — ver README pro raciocínio da consolidação).
x-subot-env: &subot-env
  SUBOT_HOSTS_FILE: /opt/subot/config/hosts.yaml
  SUBOT_ALLOWLIST_FILE: /opt/subot/config/policy/allowlist.yaml
  SUBOT_DESTRUCTIVE_FILE: /opt/subot/config/policy/destructive_patterns.yaml
  SUBOT_SSH_DIR: /opt/subot/secrets/ssh
  # Passphrase da chave privada do bastião — de propósito SEM default e SEM vir de .env aqui.
  # Só existe se você exportar a variável no shell antes de 'docker compose up' (ver README);
  # nunca fica persistida em disco. Sem ela, a chave (se gerada com passphrase) não abre.
  SUBOT_SSH_KEY_PASSPHRASE: ${SUBOT_SSH_KEY_PASSPHRASE:-}
  SUBOT_AUDIT_DIR: /opt/subot/data/audit
  SUBOT_CONFIRM_STORE: /opt/subot/data/audit/.confirm_tokens.json
  SUBOT_CONFIRM_TOKEN_TTL_SECONDS: ${SUBOT_CONFIRM_TOKEN_TTL_SECONDS:-300}
  SUBOT_STRICT_KEY_PERMS: ${SUBOT_STRICT_KEY_PERMS:-false}
  SUBOT_AGENTS_DIR: /opt/subot/agents
  SUBOT_PROVIDERS_FILE: /opt/subot/config/providers.yaml
  SUBOT_MCP_SERVERS_DIR: /opt/subot/mcp-servers
  GUACAMOLE_BASE_URL: http://guacamole:8080/guacamole
  GUACAMOLE_ADMIN_USER: ${GUACAMOLE_ADMIN_USER:-guacadmin}
  GUACAMOLE_ADMIN_PASSWORD: ${GUACAMOLE_ADMIN_PASSWORD:-guacadmin}
  # Ollama roda dentro deste MESMO container agora — local, não é mais outro serviço na rede.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
  LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
  VLLM_BASE_URL: ${VLLM_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

networks:
  # Rede própria e isolada para comunicação entre os componentes do subot. Segmentação adicional
  # (ex.: separar frontend/backend em redes distintas) fica como próximo passo — ver README.
  subot_net:
    driver: bridge

services:
  guac-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GUACDB_DATABASE:-guacamole_db}
      POSTGRES_USER: ${GUACDB_USER:-guacamole}
      POSTGRES_PASSWORD: ${GUACDB_PASSWORD:?defina GUACDB_PASSWORD em .env — rode scripts/setup.sh}
    volumes:
      - ./data/guac-db:/var/lib/postgresql/data
      - ./containers/guacamole/initdb:/docker-entrypoint-initdb.d:ro
    networks: [subot_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GUACDB_USER:-guacamole}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  guacd:
    image: guacamole/guacd:1.5.5
    restart: unless-stopped
    volumes:
      - ./data/guac-recordings:/var/lib/guacd/recordings
    networks: [subot_net]
    mem_limit: 512m

  guacamole:
    image: guacamole/guacamole:1.5.5
    restart: unless-stopped
    depends_on:
      guac-db:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRES_HOSTNAME: guac-db
      POSTGRES_DATABASE: ${GUACDB_DATABASE:-guacamole_db}
      POSTGRES_USER: ${GUACDB_USER:-guacamole}
      POSTGRES_PASSWORD: ${GUACDB_PASSWORD:?defina GUACDB_PASSWORD em .env — rode scripts/setup.sh}
    # Publicada direto em 8080 (HTTP puro, sem TLS) — único ponto de entrada público da stack
    # hoje. Sem proxy/TLS na frente por decisão explícita (ver README, seção de segurança).
    ports:
      - "8080:8080"
    networks: [subot_net]
    mem_limit: 512m

  # Container único: Claude Code (ponto de partida / uso interativo) + subot_orchestrator (motor
  # multi-IA próprio) + Ollama (inferência local, processo em background) + API REST (processo em
  # background) + servidores MCP + cliente SSH com a chave do bastião. Sem porta publicada — use
  # 'docker compose exec'. Nome do container resultante: subot-agent-1.
  agent:
    build:
      context: .
      dockerfile: containers/agent/Dockerfile
    restart: unless-stopped
    depends_on: [guacamole]
    environment: *subot-env
    volumes:
      - ./config:/opt/subot/config
      - ./agents:/opt/subot/agents
      - ./.claude:/opt/subot/.claude
      - ./mcp-servers:/opt/subot/mcp-servers:ro
      - ./packages:/opt/subot/packages:ro
      - ./secrets/ssh:/opt/subot/secrets/ssh:ro
      - ./data/audit:/opt/subot/data/audit
      - ./data/agent-home:/home/subot
      - ./data/ollama-models:/home/subot/.ollama
    # API REST (uvicorn, porta 8081) não é publicada em lugar nenhum — só alcançável de dentro da
    # rede subot_net (ex.: 'docker compose exec agent curl localhost:8081/health') até que algum
    # proxy volte a ficar na frente dela. Ver README, "Fora de escopo".
    networks: [subot_net]
    stdin_open: true
    tty: true
    mem_limit: 10g
    cpus: 4.0
